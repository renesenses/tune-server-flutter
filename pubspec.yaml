name: tune_server
description: "Tune serveur — le serveur Tune dans le téléphone, avec l'interface de la télécommande."
version: 0.9.147+512
publish_to: 'none'

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # --- L'interface : celle de la télécommande, PAS une copie ---
  # tune-remote-flutter est aussi un paquet Dart (`tune_remote`). On le prend
  # en dépendance git ÉPINGLÉE sur un commit : un seul code d'interface pour
  # les deux applications, et une montée de version explicite (changer
  # `ref`), rejouée par la CI. Voir CLAUDE.md, « L'interface ».
  tune_remote:
    git:
      url: https://github.com/renesenses/tune-remote-flutter.git
      ref: 7776c86c7f439707a3df9467570a00979b93715d

  # --- Le moteur : libtuneserver.so (Rust) par Dart FFI ---
  ffi: ^2.1.3

  # --- Service au premier plan (mediaPlayback) qui garde le serveur vivant ---
  flutter_foreground_task: ^8.13.0

  # --- Dossier privé de la base, préférences partagées avec l'interface ---
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Icône de lancement Android (logo carré Mozaik Labs, fond noir).
# android-only : ne touche PAS aux icônes iOS. Le foreground adaptive est la
# version déjà paddée (marque centrée) → tient dans la safe-zone, zéro rognage.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/mozaik_icon_full.png"
  adaptive_icon_background: "#000000"
  # Version pleine en foreground : l'inset 16% du lanceur gère la safe-zone.
  # Fond du logo noir = adaptive background noir → rognage des coins invisible.
  adaptive_icon_foreground: "assets/icon/mozaik_icon_full.png"
  min_sdk_android: 24

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Les `.so` du serveur Rust sont versionnés dans ce dépôt. Rien ne signalait
  # qu'ils dataient de trois semaines et demie : les testeurs Android ont tourné
  # sur rust v0.8.354 sous une interface 0.9.76 (#1751). Ce job rend la dérive
  # visible dès la PR, avant qu'un APK ne parte chez les testeurs.
  native-libs:
    name: Bibliothèques natives à jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les libtuneserver.so embarqués
        run: ./scripts/check-native-libs.sh

  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Doit fournir Dart >= 3.11.3 (cf. pubspec `sdk: ^3.11.3`).
          # 3.32.x livrait Dart 3.8.1 → `flutter pub get` échouait.
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      # L'interface vient de tune-remote-flutter, dépôt PRIVÉ, en dépendance
      # git épinglée (pubspec.yaml). Le jeton par défaut de la CI ne lit que
      # ce dépôt-ci : il faut un jeton en lecture seule sur l'autre.
      - name: Accès en lecture à tune-remote-flutter
        env:
          JETON: ${{ secrets.TUNE_REMOTE_READ_TOKEN }}
        run: |
          if [ -z "$JETON" ]; then
            echo "::error::Secret TUNE_REMOTE_READ_TOKEN absent : impossible de lire tune-remote-flutter (dépendance de l'interface)."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${JETON}@github.com/renesenses/tune-remote-flutter".insteadOf \
            "https://github.com/renesenses/tune-remote-flutter"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Greffon local verrou_multicast
        working-directory: packages/verrou_multicast
        run: |
          flutter pub get
          flutter analyze
          flutter test

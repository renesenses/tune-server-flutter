name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Avant toute chose : les .so embarqués doivent être ceux de la version
      # qu'on distribue. Sans ce contrôle, un APK peut partir chez les testeurs
      # avec un moteur périmé — vécu, rust v0.8.354 sous l'app 0.9.76 (#1751).
      # Placé avant l'installation de Flutter pour échouer en quelques secondes.
      - name: Vérifier les bibliothèques natives (garde-fou #1751)
        run: ./scripts/check-native-libs.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Without a stable release keystore, every runner signs with its own
      # freshly-generated debug key: each APK gets a different signature and
      # Android refuses the in-place update ("Application non installée",
      # forum #584). Skipped when the secret is absent so forks still build.
      - name: Install release keystore
        # secrets.* is not allowed in a step `if` (GitHub rejects the whole
        # workflow file: both v0.9.6 tag runs died with "workflow file
        # issue"). Route through env and guard in shell instead — forks
        # without the secret still build unsigned.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "no keystore secret — building unsigned"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/tune-upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=tune-upload-keystore.jks"
          } > android/key.properties

      # One APK per ABI instead of a single "fat" one. The fat APK carried every
      # architecture at once (162 MB), including ~63 MB of x86_64 that only
      # emulators can use — enough to fail installation on a phone that is short
      # on free space. Per-ABI builds bring the phone download down to ~55 MB.
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Rename APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OUT=build/app/outputs/flutter-apk
          # arm64 is the default download: every 64-bit Android device, i.e.
          # anything sold in the last several years.
          cp "$OUT/app-arm64-v8a-release.apk"   "tune-server-${VERSION}-android-arm64.apk"
          # Kept for older 32-bit devices.
          cp "$OUT/app-armeabi-v7a-release.apk" "tune-server-${VERSION}-android-armv7.apk"
          for f in tune-server-${VERSION}-android-*.apk; do
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done
          ls -la tune-server-*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            tune-server-*.apk
            tune-server-*.apk.sha256

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Without --groups the APK is uploaded but handed to nobody: it shows up in
      # the Firebase console while every tester keeps waiting. That is why the
      # last build testers actually received was 0.9.41.
      # The group name carries an accent, so it must stay quoted.
      - name: Upload to Firebase App Distribution
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute \
            "tune-server-${{ steps.version.outputs.version }}-android-arm64.apk" \
            --app "${{ secrets.FIREBASE_ANDROID_APP_ID }}" \
            --groups "tune-béta-testeurs" \
            --release-notes "Tune v${{ steps.version.outputs.version }}" \
            --token "${{ secrets.FIREBASE_CI_TOKEN }}" \
            | tee /tmp/fad.log
          # The CLI can report a 404 on the group and still exit 0, so the
          # success line is checked explicitly rather than trusted.
          grep -q "distributed to testers/groups successfully" /tmp/fad.log || {
            echo "::error::Firebase upload succeeded but distribution to testers FAILED"
            exit 1
          }

  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "tune-server-${VERSION}-ios.ipa" Payload
          shasum -a 256 "tune-server-${VERSION}-ios.ipa" | awk '{print $1}' > "tune-server-${VERSION}-ios.ipa.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            tune-server-*.ipa
            tune-server-*.ipa.sha256

  release:
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Tune Server Flutter v${{ github.ref_name }}

            ### Downloads
            - **Android (most devices)**: `tune-server-*-android-arm64.apk` — 64-bit, ~55 MB
            - **Android (older 32-bit devices)**: `tune-server-*-android-armv7.apk`
            - **iOS**: `tune-server-*-ios.ipa` — Unsigned IPA (for TestFlight, use Xcode to upload)
          files: |
            artifacts/tune-server-*.apk
            artifacts/tune-server-*.apk.sha256
            artifacts/tune-server-*.ipa
            artifacts/tune-server-*.ipa.sha256
